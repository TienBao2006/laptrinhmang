version: '3.9'

services:
  bus-booking-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bus-booking-server
    ports:
      - "8888:8888"
    volumes:
      # Persist SQLite database across container restarts
      - ./data:/app/data
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    networks:
      - bus-network
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 8888)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  bus-network:
    driver: bridge
